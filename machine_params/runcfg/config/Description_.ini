	English_Description=
	Korean_Description=
	Chinese_Description=使用者將產品放到Loader上，進Tray後會要求指定IC要放置到Arm1或Arm2，接著進行Contact Test。在測試完畢後，會自動放回Loader Tray。而Tray盤需手動取出
