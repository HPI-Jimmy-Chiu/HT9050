[D47]    
	English_Title=Enable socket clean function
	Korean_Title=
	Chinese_Title=進行Socket清潔功能
	English_Description=This is air purge function. After enable this function, will display「Socket Purge Count」function in「Condition」window (please see the picture on right). These two functions are connected.「Socket Purge Count」is used to check contact count, and this function is used to set after contact how many times will proceed socket clean. May set up contact count and clean time by oneself.
	Korean_Description=
	Chinese_Description=而此次功能是用來設定contact多少次後進行Socket清潔功能。可自行設定contact count及清理時間。
[D48]    
	English_Title=Disable Z1, Z2 function when power off, or EMG press
	Korean_Title=
	Chinese_Title=
	English_Description=This is used to disable Z1, Z2 button function during EGM stop situation. In general, when press EMG button, the Z1、Z2 button will flash, and if we press and hold the Z1 button at the same time, it will release the torque from the ARM1 Z motor and enable the head lowering. On the other hand, if we click this function, even press Z1 button during EMG stop situation,the head will not lowering.
