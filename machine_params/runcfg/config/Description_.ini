	Chinese_Title=設定最大下壓扭力公斤數
	English_Description=This is used to set up max preasure torque value. When Index press dwon to socket, if the preasure torque over the set value, the system will show alarm to inform operator. It can use mouse to select the preasure torque value from the pull-down menu, currently it supports 70kg、80kg and 90kg.
