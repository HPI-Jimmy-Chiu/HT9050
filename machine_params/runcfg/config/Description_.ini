	Korean_Title=
	Chinese_Title=開啟測試完成後上升及等待功能
	English_Description=After test is complete, it will rise some distance and wait for a while, then moves quickly to Shuttle and place IC in it. After enable this option, it can input the upward distance and waiting time.
	Korean_Description=
	Chinese_Description=開啟測試完成後上升一段距離，並等待一段時間後再快速離開放置到Shuttle上；點選後可以輸入上升距離及等待時間。
[D22]  
	English_Title=Suport multi double contact
	Korean_Title=
	Chinese_Title=支援重覆下壓測試功能
	English_Description=In general, after operator select double contact, when first contact fail, head will do second time contact. After enable this function, head may contact over twice. Please use mouse to select contact times from the right-side pull-down menu.
	Korean_Description=
	Chinese_Description=正常情況下，在操作者選擇double contace後，若第一次contact失敗，會再做第二次contact。此選項勾選後，便可做二次以上的contact，contact次數可於右旁下拉式選項內選擇。
