[D10]  
	English_Title=Manual height use Z1，Z2 button to UP/Down
	Korean_Title=
	Chinese_Title=使用Z1,Z2按鈕進行高度測試
	English_Description=It is used to proceed height test, it needs to cooperate with [Z1], [Z2] which above [Index]. To press [Z1] button, the Arm1 Head will lowering down to ideal height. On the other hand, press [Z2] button may adjust Arm2 height. PS:To adjust Arm1 height: Press [Z1] is for lowering down, [Z2] is for rising. To adjust Arm2 height: Press [Z2] is for lowering down, [Z1] is for rising.
	Korean_Description=
	Chinese_Description=用來進行高度測試，並且須配合Index上方的﹝Z1﹞、﹝Z2﹞二個按鈕，當按下﹝Z1﹞按鈕時可以使Arm1下壓頭下降至適合高度，反之按下﹝Z2﹞按鈕時可以使Arm2下壓頭下降至適合高度。註 : 調整 Arm1下壓頭高度 : 按﹝Z1﹞按鈕為下降，﹝Z2﹞按鈕則為上升。調整Arm2下壓頭高度 : 按﹝Z2﹞按鈕為下降，﹝Z1﹞按鈕則為上升。
