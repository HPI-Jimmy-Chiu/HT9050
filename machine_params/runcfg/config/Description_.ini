	English_Description=When IC fall, this is used to re-check is there any IC in socket by Test Arm. After disable this function, when IC fall from Index, please press「Start」button, then TestArm will go to socket slowly, and check is there any IC in socket.
	Korean_Description=
	Chinese_Description=當IC掉落時是否讓Test ARM再至Socket去檢查是否有IC在仍Socket裡面。未選擇此項時，遇到IC掉落(指在Index部份)，在排除後按「Start按鈕時，Test ARM會再慢速至Socket裡檢查是否有IC留在Socket裡。
[D42]    
