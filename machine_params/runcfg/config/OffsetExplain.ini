[Input Shuttle]
English=InputShuttle:all the setups in this page are about height adjustments from InputArm to Shuttle; as for the heights from InputArm to Shuttle1and Shuttle2, they are adjusted individually. Thus, Suttle1 and Shuttle2 can be seen on the window. Located on the far bottom, Close Pitch and Open Pitch are the two distances Z-axle needs to open and close for moving InputArm to pick up and place down the ICs.(Please see the picture on right.)(1)  X Offset:this is to adjust X offset.(2)  Y Offset:this is to adjust Y offset.(3)  Release Offset: this is to adjust the  heightoffset for moving Z-axle to place down the IC.
Chinese=本分頁裡所有設定都是InputArm到Shuttle時位置的調整，而InputArm到Shuttle1Shuttle2的位置是獨立調整，所以在畫面上會看到Suttle1及Shuttle2兩項目，最下方的Close Pitch及Open Pitch則是指InputArm在吸取、放置IC時兩個Z軸所須開閉的間距(1)  X Offset：係指X軸的偏移量調整。(2)  Y Offset：係指Y軸的偏移量調整。(3) Release Offset：係指Z軸放置IC的高度偏移量調整
[HotPlate]
English=HotPlate: all the setups in this page are about  height adjustments from InputArm  to HotPlate; as for the heights from InputArm  to HotPlate1 and HotPlate2,  they are adjusted individually. Thus, HotPlate1 and HotPlate2 can be seen on the window. (Please see the picture on right.)(1)  X Offset: this is to adjust X offset.(2)  Y Offset: this is to adjust Y offset.(3)  Pick Up Offset: this is to adjust the height offset for moving Z-axle to pick up the IC.(4)  Release Offset: this is to adjust the height offset for moving Z-axle to place down the IC.NB: (1) Pick Up Offset box and Release Offset box are used for setting both Hotplate1 and 2.(2) If Z-axle's two pitches are not accurate, please enter <InputShuttle> to adjust <InArm 50mm Pitch1> and <InArm 80mm Pitch1>.
Chinese=HotPlate：本分頁裡所有設定都是InputArm到HotPlate時位置的調整，而InputArm到HotPlate1和HotPlate2是獨立調整，所以在畫面上會看到HotPlate1及HotPlate2兩項目(如右圖所示)：(1)  X Offset：係指X軸的偏移量調整。(2)  Y Offset：係指Y軸的偏移量調整。(3) Pick Up Offset：係指Z軸吸取IC的高度偏移量調整。(4) Release Offset：係指Z軸放置IC的高度偏移量調整。註：(1)  兩個HotPlate的Pick Up及Release高度的偏移設定是共用的。(2)  如果兩Z軸的間距不符，請至「InputShuttle」裡去調整「InArm 50mm Pitch1」及「InArm80mm Pitch1」選項。
[Loader Tray]
English=LoaderTray: this page is used to adjust the tray height separated by Loader  and the position where InArm picking up the IC from the Tray  during the input.(1)Z Separate: this is to adjust the tray height separated by Loader; moving upward is positive and downward is negative. (2)  X Offset: this is to adjust X offset.(3)  Y Offset: this is to adjust Y offset.(4)  Pick Up Offset: this is to adjust the height offset for moving Z-axle to pick up the IC.(5)  InArm 50 mm Pitch 1: this is to adjust the Pitch for moving InARM to pick up the IC from the tray.(6)  InArm 80 mm Pitch 1: this is to adjust the Pitch for moving InARM to pick up and place down the IC at the kits.(7)  InArm 50 mm Pitch 2: this is to adjust the Pitch for moving Z2 of InARM to pick up the IC from the tray (only for HT8080). (8) InArm 80 mm Pitch 2: this is to adjust the Pitch for moving Z2 of InARM to pick up and place down the IC at the kits (only for HT8080). (9)  8080 InArm Rear Sock X Offset:this is to adjust the offsets of X-axle and first set when moving Z2 of InARM to pick up the IC.(10)  8080 InArm Rear Sock Y Offset: this is to adjust the offsets of Y-axle and first set when moving Z2 of InARM to pick up the IC from the Loader. (11)  InArm Z1-Z2 Height Offset: this is to adjust the height difference between Z1 and Z2 of InArm.(12)  InArm Z3-Z2 Height Offset: this is to adjust the height difference between Z3 and Z2 of InArm. (13)  InArm Z4-Z2 Height Offset: this is to adjust the height difference between Z4 and Z2 of InArm.
Chinese=(1)  Z Sparate：為Loader分離Tray高度偏移量調整，往上為正，下為負值。(2)  X Offset：係指X軸的偏移量調整。(3)  Y Offset：係指Y軸的偏移量調整。(4)  Pick Up Offset：指的是Z軸吸取IC的高度偏移量調整。(5)  InArm 50 mm Pitch 1：調整InARM至粹盤吸取IC時的Pitch。(6)  InArm 80 mm Pitch 1：調整InARM至kits吸取、放置IC時的Pitch。(7)  InArm 50 mm Pitch 2：調整InARM第二組Z軸至粹盤吸取IC時的Pitch(限HT8080使用)(8)  InArm 80 mm Pitch 2：調整InARM第二組Z軸至kits吸取、放置IC時的Pitch(9)  8080 InArm Rear Sock X Offset：調整InARM第二組Z軸至Loader吸取IC時X軸和第一組的偏差值。(10)  8080 InArm Rear Sock Y Offset：調整InARM第二組Z軸至Loader吸取IC時Y軸和第一組的偏差值。(11)  InArm Z1-Z2 Height Offset：用來調整Z1,Z2兩軸的高度差。(12)  InArm Z3-Z2 Height Offset：用來調整Z3,Z2兩軸的高度差。(13)  InArm Z4-Z2 Height Offset：用來調整Z4,Z2兩軸的高度差。
[OutPut Shuttle]
English=OutputShuttle: all the setups in this page are about height adjustments from OutputArm to Shuttle; as for the heights from OutputArm to Shuttle1 and Shuttle2, they are adjusted individually. Thus, Shuttle1 and Shuttle2 can be seen on the window. Located on the far bottom, Close Pitch and Open Pitch are the two distances Z-axle needs to open and close for moving OutputArm to pick up and place down the ICs.(1)  X Offset: this is to adjust X offset.(2)  Y Offset: this is to adjust Y offset.(3)  Pick Up Offset: this is to adjust the height offset for moving Z-axle to place down the IC.(4)  OutArm 50 mm Pitch 1: this is to adjust the Pitch for moving OutARM to pick up the IC from the tray. (5)  OutArm 80 mm Pitch 1: this is to adjust the Pitch for moving OutARM to pick up and place down the IC at the kits. (6)  OutArm 50 mm Pitch 2: this is to adjust the Pitch for moving Z2 of OutARM to pick up the IC from the tray (only for HT8080). (7)  OutArm 80 mm Pitch 2: this is to adjust the Pitch for moving Z2 of OutARM to pick up and place down the IC at the kits (only for HT8080). (8)  OutArm Z1-Z2 Height Offset: this is to adjust the height difference between Z1 and Z2 of OutArm.(9)  OutArm Z3-Z2 Height Offset: this is to adjust the height difference between Z3 and Z2 of OutArm. (10)  OutArm Z4-Z2 Height Offset: this is to adjust the height difference between Z4 and Z2 of OutArm.
Chinese=本分頁裡所有設定都是OutputArm到Shuttle時位置的調整，而OutputArm到Shuttle1和Shuttle2的位置也是獨立調整，所以在畫面上會看到Suttle1及Shuttle2兩項目，最下方的Close Pitch及Open Pitch則是指OutputArm在吸取、放置IC時兩個Z軸所須開閉的間距。(1)  X Offset：係指X軸的偏移量調整。(2)  Y Offset：係指Y軸的偏移量調整。(3)  Pick Up Offset：係指Z軸放置IC的高度偏移量調整。(4)  OutArm 50 mm Pitch 1：調整OutARM至粹盤吸取IC時的Pitch。(5)  OutArm 80 mm Pitch 1：調整OutARM至kits吸取、放置IC時的Pitch。(6)  OutArm 50 mm Pitch 2：調整OutARM第二組Z軸至粹盤吸取IC時的Pitch(限HT8080使用)。(7)  OutArm 80 mm Pitch 2：調整OutARM第二組Z軸至kits吸取、放置IC時的Pitch(限HT8080使用)。(8)  OutArm Z1-Z2 Height Offset：用來調整Z1,Z2兩軸的高度差。(9)  OutArm Z3-Z2 Height Offset：用來調整Z3,Z2兩軸的高度差。(10) OutArm Z4-Z2 Height Offset：用來調整Z4,Z2兩軸的高度差。
[UnLoader]
English=UnLoader Tray: this page is  used to adjust the position and height for OutArm  to place  the IC to UnLoader tray; UnLoader Tray consists of six trays: Auto1,2,3 and Fix1,2,3; the X and Y values  of each Tray are adjusted individually, but the heights for placing down the IC are only two types: Auto and Fix, that is, Auto1,2,3 have the same height, so are Fix1,2,3.It can also set up and make each tray have an individual height when leasing the ICs.<X2 Offset> and <Y2 Offset> are used to adjust the difference between Z1 and Z2.
Chinese=此頁用來設定OutArm放置IC至UnLoader Tray位置及高度的調整；UnLoader Tray係指包含Auto1、2、3及Fix1、2、3等六個Tray；每個Tray的X、Y值是獨立調整，但是釋放IC的高度值僅分Auto及Fix兩種；即Auto1、2、3放置IC的高度為一致，而Fix1、2 、3 另外設立一組共用。我們在「維護」裡也可以設定成每個Tray都有獨立的釋放IC的高度。「X2 Offset」及「Y2 Offset」是用於調整第二組Z軸和第一組的差異值。
[Index Arm]
English=IndexArm: this page is used to set up the contact heights of TestArm1, TestArm2 and Socket Base in Index and the position offset of the Shuttle moving toward the right direction. Thus, it needs be more careful and is divided into two types: TestArm1 and TestArm2.(1) Pick Up Offset: this is to adjust the height offset for moving TestArm Z to pick up the IC from the Shuttle. (2)  Release Offset: this is to adjust the height offset for moving TestArm Z to place down the IC. (3)  Contact Height Offset: this is to adjust the height offset for pressing down TestArm to contact the Socket after picking up the IC. (4)  Shuttle Right Offset: this is to adjust the offset for moving the Shuttle toward the right end.PS. to adjust the value of <Shuttle Right Offset>, please modify again when the Shuttle is moving toward left. Otherwise, the system may become abnormal when reading the point data in read time.
Chinese=此頁是用來設定Index裡TestArm1、TestArm2和Socket Base的接觸高度及Shuttle右移位置的偏移設定，必須較小心，一樣區分TestArm1及TestArm2。(1)  Pick Up Offset：係指TestArm Z軸至Shuttle吸取IC的高度偏移量調整。(2)  Release Offset：係指TestArm Z軸放置IC的高度偏移量調整。(3)  Contact Height Offset：係指TestArm吸到IC後下壓至和Socket接觸高度的偏移調整。
(4)  Shuttle Right Offset：係指Shuttle至右端定位點偏移調整。PS. 在調整Shuttle Right Offset的偏差值，請於Shuttle移動至左邊時再進行修改，否則在即時讀取點位資料時造成系統異常。
[TrayArm]
English=TrayArm: this is to adjust the offset for moving the empty-tray arm to pick up the tray. The instruction will be discussed briefly below: (1) Pick Up From Loader Offset: this is to adjust the offset for moving the empty-tray arm to pick up the tray at the Loader. (2) Pick Up From Buffer Offset: this is to adjust the offset for moving the empty-tray arm to pick up the empty tray at the Empty. (3) Pick Up From Color Offset: this is to adjust the offset for moving the empty-tray arm to pick up the Color Tray at the Empty. (4)  Place To Auto1 Offset: this is to adjust the offset for moving the empty-tray arm to place down the empty tray at Auto1. (5)  Place To Auto2 Offset: this is to adjust the offset for moving the empty-tray arm to place down the empty tray at Auto2.(6)  Place To Auto3 Offset: this is to adjust  the offset for moving the empty-tray arm to place down the empty tray at Auto3.
Chinese=係指空粹手臂吸取Tray位置的偏移調整，以下做簡略說明：(1)Pick Up From Loader Offset：係指空粹手臂至Loader吸取Tray 的位置偏移調整。(2) Pick Up From Buffer Offset：係指空粹手臂至Empty吸取EmptyTray的位置偏移調整。(3) Pick Up From Color Offset：係指空粹手臂至Empty吸取Color Tray的位置偏移調整。(4) Place To Auto1 Offset：係指空粹手臂放空粹至Auto1時的位置偏移調整。(5) Place To Auto2 Offset：係指空粹手臂放空粹至Auto2時的位置偏移調整。(6) Place To Auto3 Offset：係指空粹手臂放空粹至Auto3時的位置偏移調整。
[Scanner]
English=Scanner: after selecting the function of scanner, this option will be added to the <Offset>. The function will be discussed briefly below (Please see the picture on right): (1) Z1 Inspect Height: this is to adjust the  height for moving Z1 to Inspect Zoon. (2) Z2 Inspect Height: this is to adjust the height for moving Z2 to Inspect Zoon.
(3) X Offset: this is to adjust the offset for moving OutArm X to Inspect Zoon.(4) Y Offset: this is to adjust the offset for moving OutArm Y to Inspect Zoon.(5) Inspect Wait Time: this is the successive inspecting time. 
Chinese=當有啟動Scanner選項時，在offset裡便會多出此一選項設定，以下對此功能做簡略說明(參考右圖)：(1) Z1 Inspect Height：調整Z1至檢查區的高度。(2) Z2 Inspect Height：調整Z2至檢查區的高度。(3) X Offset：OutArm至檢查區X軸的偏移值設定。(4) Y Offset：OutArm至檢查區Y軸的偏移值設定。(5) Inspect Wait Time：持續檢查時間。
 