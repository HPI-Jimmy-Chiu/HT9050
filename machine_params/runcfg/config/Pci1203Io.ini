; =============================================================================
;  Pci1203Io.ini  --  每一站實際接線的輸出點數
;
;  為什麼需要這個檔：卡片的 IO 對應表只講「過程資料有幾個位元組」，
;  它不知道那顆模組上面實際插了幾顆閥。20260918 實測：對應表對站 11/12/13
;  各給 7 個位元組（56 bit），而機構上每顆只有 20 點。
;  對應表每一筆的 ByteLength 都是 0、ModuleName 都是 Unknown ——
;  卡片不是藏了更好的數字，它沒有那個數字。
;
;  沒有列在這裡的站 = 「未宣告」，畫面會照舊顯示全部位元組。
;  少宣告只是畫面多幾個點，宣告錯會把真的輸出點藏起來 —— 所以預設是不藏。
;
;  站號用十進位，跟畫面上括號裡的數字一樣（0x0B 就是 11）。
;  改完不用重開程式，下一次更新就生效。
; =============================================================================

; CTEU-MPL-007F11 x3 — 使用者 20260918 回報：機構上每顆只有 20 點輸出
[station11]
doPoints=20

[station12]
doPoints=20

[station13]
doPoints=20