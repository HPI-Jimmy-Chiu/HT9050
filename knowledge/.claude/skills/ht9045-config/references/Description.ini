	Korean_Title=
	Chinese_Title=切換到Operator時不儲存參數
	English_Description=Allows the operator to disable Saving Parameters when switch to operator. This provides flexibility to configure the handler behavior according to different production scenarios and requirements.
	Korean_Description=
	Chinese_Description=切換至Operator模式時不自動儲存目前參數，避免誤覆蓋設定。
[A02]
	English_Title=Can select Normal or Prime bin data
	Korean_Title=
	Chinese_Title=可以選擇兩種Bin設定方式
	English_Description=Allows the operator to can select Normal or Prime bin data. This provides flexibility to configure the handler behavior according to different production scenarios and requirements.
	Korean_Description=
	Chinese_Description=正常情況下，我們可在[Bin]頁面內設定 Normal 模式及重測模式時的產品分類原則。勾選此功能後，改以 Prime Mode 設定 Bin 別，
						Normal 模式與重測模式的產品分類將會一樣，即不提供重測模式分類。(此為選配功能)
[A03]
	English_Title=After home, pick and carry IC put to error bin
	Korean_Title=
	Chinese_Title=歸零後，Index sucker上及Kit上的IC將歸類為interface error。
	English_Description=This is used to definiens IC which on Index sucker and Kit as interface error after handler initial.
	Korean_Description=
