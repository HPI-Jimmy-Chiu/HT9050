	Korean_Description=
	Chinese_Description=放料到In Shuttle後,機台會根據設定的下壓次數進行測試的動作。如果測試中有發生掉料或是測試結果有出現Reject Bin，則流程會馬上停止。最終產品會被自動放回Input Shuttle。
