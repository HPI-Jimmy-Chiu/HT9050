[A01]
	English_Title=Auto switch to operator when idle over              sec.(>10Sec)
	Korean_Title=
	Chinese_Title=Handler閒置超過1分鐘時,自動切換至Operator模式。
	English_Description=This is used to switch to operator mode automatically when handler is idling over 1 minute.
	Korean_Description=
	Chinese_Description=當handler閒置超過1分鐘時,自動切換至Operator模式。
[A01-1]
	English_Title=Press start auto switch to operator
	Korean_Title=
	Chinese_Title=按下Start後自動切換為Operator
	English_Description=Enables control over press start auto switch to operator. Adjust this setting based on the production workflow to achieve the desired operational behavior.
	Korean_Description=
	Chinese_Description=按下Start開始生產時，系統自動切換為Operator模式。
[A01-2]
