N06.caption: Pengaturan FTP untuk file resep (upload/download)
N06.desc: Menyinkronkan file resep antara handler dan server FTP pusat, memungkinkan manajemen resep terpusat di beberapa mesin.
N06.when: Aktifkan di lingkungan fab di mana resep harus konsisten di banyak handler.
N06.warning: Verifikasi kredensial FTP dan jangkauan jaringan sebelum mengaktifkan run produksi.
N06.typical: Dinonaktifkan secara default; diaktifkan hanya setelah server FTP yang disetujui IT tersedia.
N07-1.caption: Aktifkan komunikasi SECS/GEM
N07-1.desc: Mengaktifkan antarmuka SEMI E5/E30 (SECS/GEM) sehingga handler dapat dikendalikan dan dimonitor oleh sistem MES host.
N07-1.when: Diperlukan saat mengintegrasikan handler ke MES sesuai SEMI atau lingkungan otomasi pabrik.
N07-1.warning: GemSys.ini harus dikonfigurasi dengan IP/port host dan ID perangkat yang benar sebelum diaktifkan—nilai salah akan memblokir operasi resep.
N07-1.typical: Dinonaktifkan secara default; aktifkan hanya setelah commissioning host selesai.
