L43.caption: Aktifkan Fungsi Power Follow
L43.desc: Bila diaktifkan, pemanas chamber melacak suhu junction IC secara real-time, memastikan suhu pengujian stabil bahkan untuk perangkat berdaya tinggi.
L43.when: Gunakan opsi ini untuk perangkat berdaya tinggi (>2W) di mana kontrol ATC standar tidak dapat menjaga IC pada suhu target.
L43.warning: Power Follow memerlukan kalibrasi TJ Slope/Offset untuk perangkat. Tanpa kalibrasi, suhu dapat bergeser dan menyebabkan kehilangan yield.
L43.typical: Dinonaktifkan secara default. Aktifkan hanya setelah kalibrasi termal diverifikasi.
