A05.caption: Gunakan one touch docking (OTD)
A05.desc: Bila diaktifkan, handler menjalankan urutan docking dengan test head secara otomatis setelah menekan satu tombol.
A05.when: Gunakan bila sensor docking OTD telah terpasang dan diverifikasi.
A05.warning: Nonaktifkan jika ada sensor docking yang rusak—docking paksa dapat merusak konektor test head.
A05.typical: Diaktifkan dalam produksi setelah pemasangan selesai.
