A02.caption: Dapat memilih data Bin Normal atau Prime
A02.desc: Memungkinkan operator beralih antara dua tabel penetapan bin independen (Normal dan Prime) tanpa memuat ulang resep.
A02.when: Aktifkan bila perangkat yang sama memerlukan bin map berbeda untuk prime vs retest.
A02.warning: Mengganti mode tidak memigrasi hitungan bin yang ada; penghitung akan direset saat beralih.
A02.typical: Dinonaktifkan secara default; aktifkan hanya bila diperlukan pemisahan prime/retest.
