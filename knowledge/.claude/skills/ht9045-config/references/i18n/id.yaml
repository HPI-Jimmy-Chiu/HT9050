A10-1.caption: Aktifkan ART (Pengujian Ulang Otomatis)
A10-1.desc: Secara otomatis menjalankan ulang perangkat yang fail hingga batas retry yang dapat dikonfigurasi, memisahkan kegagalan asli dari kegagalan kontak.
A10-1.when: Aktifkan untuk perangkat yang sering mengalami kegagalan kontak intermiten atau yield first-pass rendah.
A10-1.warning: ART meningkatkan waktu throughput dan dapat menutupi keausan socket. Atur batas retry (A10-2) dengan hati-hati.
A10-1.typical: Dinonaktifkan secara default. Jika diaktifkan, batas retry = 1–2 disarankan.
