L04.caption: Toleransi suhu pengujian (±°C, rentang 2..10)
L04.desc: Mendefinisikan deviasi yang diizinkan antara suhu chamber aktual dan target sebelum pengujian dijeda.
L04.when: Perketat untuk perangkat presisi tinggi; longgarkan bila stabilitas chamber terbatas.
L04.warning: Pengaturan di bawah 2 °C dapat menyebabkan siklus pause/resume berlebihan dan menurunkan throughput.
L04.typical: Default 3 °C untuk sebagian besar perangkat.
