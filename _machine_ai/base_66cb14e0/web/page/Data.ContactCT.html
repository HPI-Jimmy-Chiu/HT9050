<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Contact Counter Kinds（cContactCT.dfm）</title>
<link rel="stylesheet" href="ht9xxx.css">
<link rel="stylesheet" href="theme.css">
</head>
<body class="winpage">

<div style="display:flex;gap:8px;" title="palClearCnt">
  <button class="btn3d" id="btClearCount" title="btClearCount">Count Clear</button>
  <button class="btn3d" id="btYieldChart" title="btYieldChart">Yield Chart</button>
</div>

<div id="rgYieldType" title="rgYieldType（TRadioGroup）" style="font-size:11px;margin-top:6px;line-height:1.9;display:grid;grid-template-columns:1fr 1fr;">
  <label><input type="radio" name="mode" value="history"> History</label>
  <label><input type="radio" name="mode" value="bybinpass"> ByBinPass</label>
  <label><input type="radio" name="mode" value="total"> Total</label>
  <label><input type="radio" name="mode" value="bybinpasspct"> ByBinPass(%)</label>
  <label><input type="radio" name="mode" value="kind"> Kind</label>
  <label><input type="radio" name="mode" value="bybinarmpass"> ByBinArmPass</label>
  <label><input type="radio" name="mode" value="kindpct" checked> Kind(%)</label>
  <label><input type="radio" name="mode" value="bybinsitepass"> ByBinSitePass</label>
</div>

<table class="yield" id="sgYield" title="sgYield（TStringGrid）"></table>

<div class="srcnote">程式碼對應：<code>cContactCT.dfm</code>／<code>cContactCT.cpp</code>；單選鈕切換統計模式</div>

<script>
// 各統計模式示意資料
var DATA={
  kindpct:{head:['','Arm 2','','Arm 1'],rows:[
    ['Aa','96.76%','Ba','99.68%'],['Ab','99.35%','Bb','98.71%'],
    ['Ac','98.71%','Bc','98.38%'],['Ad','99.03%','Bd','99.03%']]},
  kind:{head:['','Arm 2','','Arm 1'],rows:[
    ['Aa','598','Ba','616'],['Ab','614','Bb','610'],
    ['Ac','610','Bc','608'],['Ad','612','Bd','612']]},
  total:{head:['','Count'],rows:[['Total','2464'],['Pass','2432'],['Fail','32']]},
  history:{head:['Lot','Yield'],rows:[['Lot-03','98.70%'],['Lot-02','98.31%'],['Lot-01','97.95%']]},
  bybinpass:{head:['Bin','Pass'],rows:[['Bin2','2130'],['Bin3','302'],['Bin5','18']]},
  bybinpasspct:{head:['Bin','Pass%'],rows:[['Bin2','86.45%'],['Bin3','12.26%'],['Bin5','0.73%']]},
  bybinarmpass:{head:['Bin','Arm1','Arm2'],rows:[['Bin2','1066','1064'],['Bin3','150','152']]},
  bybinsitepass:{head:['Bin','Aa','Ab','Ac','Ad'],rows:[['Bin2','266','267','265','268'],['Bin3','38','37','39','36']]}
};
function render(mode){
  var d=DATA[mode]||DATA.kindpct,h='<tr>'+d.head.map(function(x){return '<th>'+x+'</th>';}).join('')+'</tr>';
  d.rows.forEach(function(r){h+='<tr>'+r.map(function(x){return '<td>'+x+'</td>';}).join('')+'</tr>';});
  document.getElementById('sgYield').innerHTML=h;
}
document.querySelectorAll('input[name=mode]').forEach(function(r){
  r.addEventListener('change',function(){render(r.value);});
});
render('kindpct');
</script>
<script src="theme.js"></script>
</body>
</html>
