<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tray Edit（uTrayEditForm.dfm / TrayEditForm）</title>
<link rel="stylesheet" href="ht9xxx.css">
<link rel="stylesheet" href="theme.css">
<style>
  #teHead{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px;margin-bottom:4px;}
  #teMotor{font-weight:bold;color:var(--navy);font-size:calc(14px*var(--fsx,1));}
  #teCaption{font-family:var(--font-mono,Consolas,monospace);font-size:calc(12px*var(--fsx,1));}
  #teWrap{position:relative;width:100%;overflow:auto;line-height:0;}
  #mtLoaderBuffer{display:block;touch-action:none;cursor:crosshair;}
  #teOverlay{position:absolute;left:0;top:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;
    text-align:center;padding:12px;line-height:1.5;background:rgba(255,255,255,.72);color:#223;
    font-size:calc(13px*var(--fsx,1));pointer-events:none;}
  #teOverlay[hidden]{display:none;}
  .teRow{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;margin-top:6px;}
  .teRow .sp{flex:1 1 auto;}
  .teBig{min-width:120px;min-height:33px;}
  #cbBinCount{min-width:145px;height:24px;font-size:calc(12px*var(--fsx,1));}
  #edtXPos,#edtYPos{width:121px;height:24px;font-size:calc(13px*var(--fsx,1));}
  .teRow label.xy{font-weight:bold;}
  .teHint{margin-top:6px;color:var(--text-dim,#667);font-size:calc(12px*var(--fsx,1));}
  #teStatus,#tePoll{min-height:1.4em;white-space:pre-wrap;font-size:calc(11px*var(--fsx,1));margin-top:2px;}
  .st-bad{color:var(--red,#c00);}
  .st-note{color:var(--text-dim,#667);}
  #teReload{margin-left:6px;font-size:calc(11px*var(--fsx,1));padding:1px 8px;}
  button[aria-busy="true"]{opacity:.6;}
</style>
</head>
<body class="winpage">
<!-- AI(W906-S10-TRAYEDIT) 20260929 (St02-E helper)：golden TTrayEditForm（906_0625_Steven uTrayEditForm.cpp／.dfm／.h）的網頁。
     所有邏輯與守衛都在 C++（TrayEditForm.cpp／WebTrayEdit.cpp，WS 指令 act.trayEdit，value＝JSON 字串）；這一頁只畫狀態、送操作。
       mtLoaderBuffer  TTMyTray 盤格（dfm 491x567）。拖曳選取＝golden MouseDown → MouseMove（ShowTray 以顏色 2 預覽）→ MouseUp（SetTray）；
                       網頁在本地預覽，放開時送一次 {"op":"select",x0,y0,x1,y1}，畫 C++ 回來的 state。
       spbUpdate       Update（golden spbUpdateClick :522-612；state.updateVisible＝false 時藏起來，golden FormShow :230）
       SpeedButton2    Abort（golden SpeedButton2Click :614-617 → Close()）
       edtXPos／edtYPos＋Button1  X／Y＋Manual Input（golden Button1Click :619-662；按編輯框開小鍵盤＝edtXPosClick :664-667）
       CheckBox1       No Save Image（golden SaveJPG :685 讀它）
       cbBinCount      只在 state.binCount.visible 時顯示（golden FormShow :95-100 在 iHasMap==2 時填 0..6）
       Button2         dfm Visible=False（golden 從不顯示），只有 state.snapshotVisible===true 時才出現
       BitBtn1         SOFT_SIMULTE 限定的 START／PAUSE（golden 建構子 :65-67），第一版不做
       表單 Caption    golden Timer1Timer :509-510 的 "(x0,y0)...(x1,y1)"，顯示在標題列下方
     接線與 JS 在 ht9045_trayedit.js。 -->

<div id="teHead">
  <span id="teMotor" title="EditTray(MotorIndexIndex) 的盤名（golden EditTray :40-53）">---</span>
  <span id="teCaption" title="TrayEditForm.Caption（golden Timer1Timer :509-510）">TrayEditForm</span>
</div>

<div id="teWrap" title="mtLoaderBuffer（TTMyTray）">
  <canvas id="mtLoaderBuffer" width="491" height="567"></canvas>
  <div id="teOverlay">等待 C++ 回應…</div>
</div>

<div id="teBelow">
  <div class="teRow">
    <button class="btn3d" id="Button2" type="button" hidden title="Button2（golden Button2Click :677-680 → SaveJPG(&quot;Enter&quot;)；dfm Visible=False）">Button2</button>
    <select id="cbBinCount" hidden title="cbBinCount（golden SetTray :476 atoi(cbBinCount-&gt;Text)，iHasMap==2）"></select>
    <span class="sp"></span>
    <button class="btn3d teBig" id="spbUpdate" type="button" title="spbUpdate（golden spbUpdateClick :522-612）">Update</button>
    <button class="btn3d teBig" id="SpeedButton2" type="button" title="SpeedButton2（golden SpeedButton2Click :614-617）">Abort</button>
  </div>
  <div class="teRow">
    <span class="sp"></span>
    <label title="CheckBox1（golden SaveJPG :685-686）"><input type="checkbox" id="CheckBox1"> No Save Image</label>
  </div>
  <div class="teRow">
    <label class="xy" for="edtXPos" title="Label2">X</label>
    <input type="text" id="edtXPos" inputmode="numeric" autocomplete="off" title="edtXPos（OnClick＝edtXPosClick :664-667 小鍵盤）">
    <label class="xy" for="edtYPos" title="Label1">Y</label>
    <input type="text" id="edtYPos" inputmode="numeric" autocomplete="off" title="edtYPos（OnClick＝edtXPosClick :664-667 小鍵盤）">
    <button class="btn3d" id="Button1" type="button" title="Button1（golden Button1Click :619-662）">Manual Input</button>
  </div>
  <div class="teHint">拖曳選取格子切換有無 IC，按 Update 寫回盤面</div>
  <div id="teStatus"></div>
  <div id="tePoll"></div>
  <div class="srcnote">程式碼對應：<code>uTrayEditForm.dfm</code>／<code>uTrayEditForm.cpp</code>（TrayEditForm）、盤格 <code>HTray.cpp</code>（TTMyTray）；C++：<code>TrayEditForm.cpp</code>、<code>WebTrayEdit.cpp</code>（act.trayEdit）</div>
</div>

<script src="theme.js"></script>
<script src="qwerty.js"></script>
<script src="ht9045_recipe_client.js"></script>
<script src="ht9045_busy_util.js"></script>
<script src="ht9045_trayedit.js"></script>
</body>
</html>
