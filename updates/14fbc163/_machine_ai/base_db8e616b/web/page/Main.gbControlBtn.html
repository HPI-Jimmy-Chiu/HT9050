<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Control Buttons（main.dfm / gbControlBtn）</title>
<link rel="stylesheet" href="ht9xxx.css">
<link rel="stylesheet" href="theme.css">
<style>
  body.winpage{padding:0;margin:0;background:var(--form-bg,#ece9d8);height:100vh;overflow:auto;}
  .cbCol{display:flex;flex-direction:column;gap:7px;padding:10px;width:150px;box-sizing:border-box;}
  /* 操作按鈕（gbControlBtn 原按鈕）：release 版隱藏、debug 版顯示 */
  html[data-mode="release"] .opGroup{display:none;}
  .cbBtn{height:41px;border:2px outset #6a8fb5;border-radius:3px;background:#004080;color:#fff;
    font:bold 15px "MS Sans Serif",sans-serif;display:flex;align-items:center;justify-content:center;
    cursor:pointer;user-select:none;letter-spacing:.5px;}
  .cbBtn:hover{background:#186dc5;}
  .cbBtn:active{border-style:inset;}
  .cbBtn.warn.on{background:#00f;color:#ff0;}                     /* PAUSE/START TrueColor=clBlue/黃字 */
  .cbBtn.on{background:#186dc5;color:#8afb8a;}
  .cbGroup{border:1px solid #99a;border-radius:3px;padding:6px 5px;display:flex;flex-direction:column;gap:7px;}
  .cbGroup>legend{font-size:11px;color:#345;padding:0 4px;}
  .cbBtn.dis{background:#7f96ad;color:#dfe6ee;cursor:default;border-style:solid;}
  .opGroup{display:flex;flex-direction:column;gap:7px;}
  /* 跳轉按鈕（pgMotionView 各 TabSheet）：兩版本皆顯示 */
  .navHd{font-size:11px;font-weight:bold;color:#345;border-top:1px solid #b7bdc4;padding-top:6px;margin-top:2px;}
  .navBtn{height:26px;border:1px solid #7a93b0;border-radius:3px;background:#e8eef6;color:#123;
    font:12px "Microsoft JhengHei",sans-serif;display:flex;align-items:center;padding:0 8px;cursor:pointer;user-select:none;}
  .navBtn:hover{background:#cfe0f4;}
  .navBtn:active{background:#b7d0ee;}
  .navBtn::before{content:"\25B8 ";color:#36c;margin-right:4px;}
</style>
</head>
<body class="winpage">
<div class="cbCol">
  <!-- 操作按鈕（debug only；release 隱藏） -->
  <div class="opGroup" id="gbControlBtn">
    <div class="cbBtn" id="BtnHome"      title="BtnHome : TBtnPanel（BtnHomeClick）">HOME</div>
    <div class="cbBtn" id="BtnReset"     title="BtnReset : TBtnPanel（BtnResetClick）">RESET</div>
    <div class="cbBtn" id="BtnOneCycle"  title="BtnOneCycle : TBtnPanel（BtnOneCycleClick）">ONE CYCLE</div>
    <div class="cbBtn" id="BtnCleanOut"  title="BtnCleanOut : TBtnPanel（BtnCleanOutClick）">CLEAN OUT</div>
    <div class="cbBtn" id="BtnTrayEnd"   title="BtnTrayEnd : TBtnPanel（BtnTrayEndClick／TRAY FEED）">TRAY FEED</div>
    <fieldset class="cbGroup" title="gbRemoteControl : TGroupBox（遠端控制，預設 Enabled=False）">
      <legend>Remote</legend>
      <div class="cbBtn dis" id="BtnSTEP"    title="BtnSTEP : TBtnPanel（BtnSTEPClick）">STEP</div>
      <div class="cbBtn dis" id="BtnT_Start" title="BtnT_Start : TBtnPanel（BtnT_StartClick）">T.Start</div>
      <div class="cbBtn dis" id="BtnZUpDown" title="BtnZUpDown : TBtnPanel（BtnZUpDownClick）">Z UpDown</div>
    </fieldset>
    <div class="cbBtn" id="BtnAlarmReset" title="BtnAlarmReset : TBtnPanel（BtnAlarmResetClick）">ALARM RESET</div>
    <div class="cbBtn warn" id="BtnPause" title="BtnPause : TBtnPanel（BtnPauseClick）">PAUSE</div>
    <div class="cbBtn warn" id="BtnStart" title="BtnStart : TBtnPanel（BtnStartClick）">START</div>
  </div>

  <!-- sbStateRecord（tsMotionView/ScrollBox1，120×74）：sbStateRecordClick → DoStateRecord(0,true)；兩版本皆顯示 -->
  <div class="navGroup">
    <div class="navHd">程式快照</div>
    <div class="navBtn" id="sbStateRecord" title="sbStateRecord : TSpeedButton（sbStateRecordClick → DoStateRecord(0,true)）" style="background:#fde9d2;border-color:#c60;">State Record</div>
    <div id="stateRecInfo" style="font-size:10px;color:#345;min-height:12px;white-space:normal;word-break:break-all;"></div>
  </div>

  <!-- 跳轉按鈕（pgMotionView 各 TabSheet → 桌面視窗；兩版本皆顯示） -->
  <div class="navGroup">
    <div class="navHd">Motion View 分頁</div>
    <div class="navBtn" data-open="motorview"     title="tsMotorView">Motor View</div>
    <div class="navBtn" data-open="motionview"    title="tsActionView">Motion View</div>
    <div class="navBtn" data-open="commview"      title="tsCommView">Comm View</div>
    <div class="navBtn" data-open="heaterview"    title="tsHeaterView">Heater View</div>
    <div class="navBtn" data-open="logs"          title="tsLogs">Logs</div>
    <div class="navBtn" data-open="shuttlesensor" title="tsShuttleSensor">Shuttle Sensor</div>
    <div class="navBtn" data-open="record"        title="tsRecord">Record</div>
    <div class="navBtn" data-open="tasklist"      title="tsTaskList">Task List</div>
    <div class="navBtn" data-open="unloaderinfo"  title="tsUnloaderInfo">Unloader Info</div>
    <div class="navBtn" data-open="aoainfo"       title="ts1（AOA Info）">AOA Info</div>
  </div>
</div>

<!-- AI(W906-XFER) 20260922 晚：補回 ht9045_recipe_client.js。
     ⚠ AI(W906-MERGE-20260923)：**這一行第二次被蓋掉了**（a016aa0 Steven
     20260923 把 web/page 進版控，用的 baseline 同樣沒有它）。第一次是
     20260922 09:44 重佈署。兩次的共同原因：reapply_overlay.py 的探針只認
     "ht9045_lotstart.js" 與 "ht9045_opbuttons.js"，命中就短路成 ok，
     所以 --check 全綠、exit 0，完全看不到這個缺口 —— 這次已一併把探針補上。
     少了它：window.HT9045Recipe 不存在（全樹唯一定義點是
     ht9045_recipe_client.js 的 global.HT9045Recipe = api），而本頁是
     background.html 掛的獨立 iframe，拿不到父頁那一份
     ⇒ ht9045_lotstart.js 的 apiReady() 為 false，擋掉每一次送出，
     Lot Start 與 START/PAUSE 按了都只回「未接線」。 -->
<script src="ht9045_recipe_client.js"></script>
<!-- AI(W906-Q27) 20260921: 控制面板的 Lot Start 區塊（我們加的）。
     ⚠ 必須排在 ht9045_recipe_client.js 之後。 -->
<script src="ht9045_lotstart.js"></script>
<!-- AI(W906-OPBTN) 20260922: 把 START / PAUSE 接到底層（我們加的）。
     本頁那個 handler 只做 classList.toggle('on')，所以在此之前
     按 START 從來沒有送出任何指令。
     ⚠ 必須排在 ht9045_recipe_client.js 之後。 -->
<script src="ht9045_opbuttons.js"></script><script src="ht9045_main_st01_ev.js"></script><!-- AI(W906-EVB6) 20260928 [W906]：B9 M-7 HOME（main.home）／CLEAN OUT（act.main.cleanOut）／RESET、ONE CYCLE、TRAY FEED、ALARM RESET（act.main.ctlButton，S169 只登記事件）；同一行 -->
<script src="state-record.js"></script>
<script>
// 操作按鈕：點擊切換 Down（模擬 TBtnPanel SetPanelStatus）；Remote 群組 disabled 不反應
document.querySelectorAll('#gbControlBtn .cbBtn:not(.dis)').forEach(function(b){
  b.addEventListener('click',function(){ b.classList.toggle('on'); });
});
// 跳轉按鈕：請 background 開啟對應視窗（尚未建立者，background {open} 有 if(win) 容錯）
document.querySelectorAll('.navBtn[data-open]').forEach(function(b){
  b.addEventListener('click',function(){
    if(window.parent!==window) window.parent.postMessage({open:b.dataset.open},'*');
  });
});
// sbStateRecord → golden sbStateRecordClick → DoStateRecord(0,true)（main.cpp:26209-26212）
// AI(W906-SR-WIRE) 20260928: EastSun「State Record 的按鈕……現在沒有記錄而且停住不能用」（畫面停在
//   「Busy: State Record #1 running」）。原因：本鈕一直走 state-record.js 的 HTML 離線通道 —— 請求只寫進
//   localStorage，再輪詢 JSON/state-record-ack.json，而 C++ 從來不寫那個檔 ⇒ C++ 根本沒收到、180 秒後才
//   ack timeout，期間再按都是 Busy。改成直接送 WS act.main.stateRecord（JsonBridge/actions/MainStateRecord.cpp
//   → fMain->sbStateRecordClick，本體 cStateRecord.cpp），存到 D:\HT9045_StateRecord\<yyyy-MM-dd HH_mm_ss>\，
//   背景複製＋7z 之後只剩同名 .zip。golden 的 SaveDialog1 在 C++ 是 GATE G4（沒有對話框＝預設資料夾），
//   所以不再跳 prompt。本鈕不會卡住：15 秒沒有回覆就放開。?offline=1 仍走舊的離線通道（沒有 C++ 時用）。
(function(){
  var b=document.getElementById('sbStateRecord'), info=document.getElementById('stateRecInfo');
  if(!b) return;
  var off=/[?&](cppoffline|offline)=(1|true|on)/i.test(location.search||'');
  function status(msg,cls){ info.textContent=msg; info.style.color=cls==='err'?'#a00':(cls==='ok'?'#070':'#345'); }
  if(off){
    if(!window.HTStateRecord) return;
    HTStateRecord.init({source:'gbControlBtn', offline:off, status:status,
      context:function(){ return {page:'Main.gbControlBtn.html', cppOffline:off}; },
      onStart:function(){ b.style.background='#f9c'; }, onFinish:function(){ b.style.background='#fde9d2'; },
      onProgress:function(a){ status('running: '+(a.currentStep||'')+' '+((a.steps||[]).length)+' steps','warn'); }
    }).catch(function(){});
    b.addEventListener('click',function(){ HTStateRecord.run({button:'sbStateRecord', manual:true, showAlarm:0}); });
    return;
  }
  var busy=false;
  function unwrap(m){ if(m&&typeof m.value==='string'){ try{ var j=JSON.parse(m.value); if(j&&typeof j==='object') return j; }catch(e){} } return m; }
  function errObj(e){ var t=(e&&e.message)||String(e); try{ var j=JSON.parse(t); if(j&&typeof j==='object') return j; }catch(x){} return {executed:false, guard:'transport', detail:t}; }
  function idle(){ busy=false; b.style.background='#fde9d2'; }
  status('State Record ready','ok');
  b.addEventListener('click',function(){
    if(busy){ status('State Record 送出中，請稍候','warn'); return; }
    var R=window.HT9045Recipe;
    if(!R||!R.rawCmd){ status('[error] ht9045_recipe_client.js 沒有載入','err'); return; }
    busy=true; b.style.background='#f9c'; status('→ State Record 送出…','warn');
    var answered=false;
    var t=setTimeout(function(){ if(!answered){ idle(); status('[error] State Record：15 秒沒有回覆（伺服器忙或斷線），可以再按一次','err'); } },15000);
    R.rawCmd('control.takeover').catch(function(){ /* 權杖不擋人時照樣可以送 */ })
      .then(function(){ return R.rawCmd('act.main.stateRecord',{value:JSON.stringify({})}); })
      .then(unwrap, errObj)
      .then(function(r){
        answered=true; clearTimeout(t); idle();
        if(r&&r.executed) status('[done] State Record → '+(r.zip||r.folder||'')+(r.backgroundRunning?'（背景複製／壓縮中，完成後只剩 .zip）':''),'ok');
        else if(r&&r.guard==='busy') status('上一筆 State Record 的背景複製／壓縮還沒結束，稍後再按','warn');
        else status('[error] State Record 沒有執行：'+((r&&r.guard)||'?')+(r&&r.detail?'（'+r.detail+'）':''),'err');
      });
  });
})();
</script>
<script src="theme.js"></script>
</body>
</html>
