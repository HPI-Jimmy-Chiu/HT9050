<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>HT9xxx 軟體啟動中</title>
<!--
  AI(W906-BOOTWAIT) 20260929: EastSun「軟體開起來時 請你先把操作頁面HTML 開起來 不然我按F5後 又等你非常久 才會把畫面開起來
  我根本不知道軟體有沒有執行」，以及「一開始不就是要 圖片的畫面嗎? 怎會是程式啟動中的頁面?」。
  所以這一頁就是 background.html 的開站載入畫面（#htLoader：鴻勁建物圖、輪播影片／圖片、進度條）—— 同一套樣式、同一批檔案
  （IMG/ScreenShot/…，這一頁跟 background.html 都在 web 根目錄，相對路徑照抄）—— 只是在 wb_serve 還沒起來的這段時間顯示。
  F5 的第一步用 tools/open_boot_wait.ps1 以 file:// 開這一頁；它每秒問一次 http://127.0.0.1:<port>/，一回應就切到
  background.html?mode=debug&machine=HT9050，接著是它自己的載入進度（N / 69）。
  ?port=8055（預設）、?target=<網址> —— 測試用。偵測：fetch(no-cors) 連得上就算起來；另外用 web 裡本來就有的一張圖當備援。
  頁面一打開就已經有東西回應 ⇒ 多半是上一次的 wb_serve 沒關（新的會綁不到 8055）：警告、不自動切。
  ⚠ 樣式與 background.html :117-144 同步；那邊改了這邊要跟著改。
-->
<style>
  html,body{margin:0;height:100%;}
  #htLoader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg,#3a5a7a,#1d2f42);color:#fff;
    font-family:"Microsoft JhengHei","Segoe UI",sans-serif;user-select:none;cursor:wait;}
  #htLoader .ldBox{width:1320px;max-width:calc(100vw - 32px);padding:0 24px 22px;box-sizing:border-box;background:rgba(8,18,29,.88);border:1px solid rgba(255,255,255,.3);border-radius:8px;box-shadow:0 12px 36px rgba(0,0,0,.58);overflow:hidden;transform:translateY(-36px);}
  #htLoader .ldHead{height:220px;margin:0 -24px;display:grid;grid-template-columns:47% 53%;background:#fff;color:#17283a;}
  #htLoader .ldCompanyImage{display:block;width:100%;height:100%;object-fit:cover;object-position:center;}
  #htLoader .ldCompany{padding:28px 38px 22px;min-width:0;display:flex;flex-direction:column;justify-content:center;}
  #htLoader .ldBrand{font-size:34px;font-weight:bold;color:#0750a5;}
  #htLoader .ldService{margin-top:8px;padding-bottom:10px;border-bottom:5px solid #0750a5;font-size:18px;font-weight:bold;color:#111;}
  #htLoader .ldIntro{margin-top:10px;font-size:14px;line-height:1.45;color:#59616b;}
  #htLoader .ldLoading{margin-top:8px;text-align:center;font-size:14px;font-weight:bold;color:#e5f1f8;}
  #htLoader .ldDivider{height:12px;margin:0 -24px;background:#fff;}
  #htLoader .ldMedia{position:relative;width:100%;height:520px;background:#111923;border:1px solid rgba(255,255,255,.2);overflow:hidden;box-sizing:border-box;}
  #htLoader .ldSlide{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .5s ease;pointer-events:none;}
  #htLoader .ldSlide.active{opacity:1;}
  #htLoader .ldDots{position:absolute;right:16px;bottom:12px;z-index:2;display:flex;gap:8px;}
  #htLoader .ldDot{width:8px;height:8px;border:1px solid #fff;border-radius:50%;background:rgba(0,0,0,.35);box-shadow:0 1px 3px rgba(0,0,0,.7);}
  #htLoader .ldDot.active{background:#df1427;border-color:#df1427;}
  #htLoader .ldProgress{padding-top:18px;}
  #htLoader .ldBar{height:22px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);border-radius:4px;overflow:hidden;}
  #htLoader .ldFill{height:100%;width:0;background:linear-gradient(90deg,#4d9633,#7fbf5f);transition:width .4s linear;}
  #htLoader .ldRow{display:flex;justify-content:space-between;margin-top:8px;font-size:14px;font-variant-numeric:tabular-nums;}
  #htLoader .ldFile{margin-top:6px;font:12px Consolas,monospace;color:#bcd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #htLoader .ldWarn{margin-top:10px;font-size:13px;color:#ffd27a;display:none;white-space:pre-wrap;}
  #htLoader .ldWarn.show{display:block;}
  #htLoader .ldWarn button{margin-left:10px;font-size:13px;padding:2px 10px;cursor:pointer;}
</style>
</head>
<body>
<div id="htLoader" role="progressbar" aria-label="HT9xxx 軟體啟動進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
  <div class="ldBox">
    <div class="ldHead">
      <img class="ldCompanyImage" src="IMG/ScreenShot/HPI_1091.png" alt="鴻勁精密公司建物">
      <div class="ldCompany">
        <div class="ldBrand">鴻 勁 精 密</div>
        <div class="ldService">專業IC測試分類機與自動化技術</div>
        <div class="ldIntro">Hon Precision, Inc. 一直與全球 OSAT 和 IDM 客戶建立了緊密的合作夥伴關係。我們的願景是成為卓越的 IC 半導體自動化設備公司，透過提供優質的產品和服務來實現這一目標。</div>
      </div>
    </div>
    <div class="ldDivider" aria-hidden="true"></div>
    <div class="ldMedia" aria-label="Hon Prec 首頁主視覺">
      <video class="ldSlide active" autoplay muted loop playsinline preload="metadata" aria-hidden="false">
        <source src="IMG/ScreenShot/Handler_Banner_1.mp4" type="video/mp4">
      </video>
      <img class="ldSlide" src="IMG/ScreenShot/twL_banner_24E27_thgcu7hqvt.jpg" alt="The Ultimate IC Test Solutions">
      <video class="ldSlide" autoplay muted loop playsinline preload="metadata" aria-hidden="true">
        <source src="IMG/ScreenShot/Poseidon_Banner_2.mp4" type="video/mp4">
      </video>
      <div class="ldDots" aria-hidden="true"><span class="ldDot active"></span><span class="ldDot"></span><span class="ldDot"></span></div>
    </div>
    <div class="ldProgress">
      <div class="ldBar"><div class="ldFill" id="ldFill"></div></div>
      <div class="ldLoading" id="ldLoading">HT9xxx 軟體啟動中，完成前無法操作 / Starting, please wait</div>
      <div class="ldRow"><span id="ldCount">等待伺服器回應</span><span id="ldPct">0%</span><span id="ldTime">0.0 s</span></div>
      <div class="ldFile" id="ldFile"></div>
      <div class="ldWarn" id="ldWarn"></div>
    </div>
  </div>
</div>
<script>
(function () {
  // ---- 輪播：跟 background.html 同一組三張；這裡沒有載入進度可以帶，改成每 8 秒換一張 ----
  var root = document.getElementById('htLoader');
  var slides = Array.prototype.slice.call(root.querySelectorAll('.ldSlide'));
  var dots = Array.prototype.slice.call(root.querySelectorAll('.ldDot'));
  var current = -1;
  function show(index) {
    if (index === current) return;
    current = index;
    slides.forEach(function (slide, i) {
      var active = i === current;
      slide.classList.toggle('active', active); slide.setAttribute('aria-hidden', active ? 'false' : 'true');
      if (slide.tagName === 'VIDEO') {
        if (active) { slide.currentTime = 0; var play = slide.play(); if (play && play.catch) play.catch(function () {}); }
        else slide.pause();
      }
    });
    dots.forEach(function (dot, i) { dot.classList.toggle('active', i === current); });
  }
  show(0);
  setInterval(function () { show((current + 1) % slides.length); }, 8000);

  // ---- 等 wb_serve ----
  var q = {};
  location.search.replace(/^\?/, '').split('&').forEach(function (kv) { if (kv) { var i = kv.indexOf('='); q[decodeURIComponent(i < 0 ? kv : kv.slice(0, i))] = i < 0 ? '' : decodeURIComponent(kv.slice(i + 1)); } });
  var port = /^\d{2,5}$/.test(q.port || '') ? q.port : '8055';
  var base = 'http://127.0.0.1:' + port + '/';
  var target = q.target || (base + 'background.html?mode=debug&machine=HT9050');
  var EXPECT = 90;                                                   // 平常 1～1.5 分鐘；進度條照這個估，最多走到 95%
  var t0 = Date.now(), done = false, polls = 0;
  var fill = document.getElementById('ldFill'), pct = document.getElementById('ldPct'), tm = document.getElementById('ldTime');
  var cnt = document.getElementById('ldCount'), file = document.getElementById('ldFile'), warn = document.getElementById('ldWarn');
  var loading = document.getElementById('ldLoading');
  file.textContent = base + ' 還沒回應（編譯 → 讀設定 → 建立畫面 → 開 1203 卡）';
  function secs() { return (Date.now() - t0) / 1000; }
  function setPct(p) { p = Math.max(0, Math.min(100, p)); fill.style.width = p.toFixed(1) + '%'; pct.textContent = Math.floor(p) + '%'; root.setAttribute('aria-valuenow', String(Math.floor(p))); }
  function tick() {
    if (done) return;
    var s = secs();
    tm.textContent = s.toFixed(1) + ' s';
    setPct(95 * (1 - Math.exp(-s / (EXPECT / 2))));                 // 前面走得快、越接近越慢，不會到 100
    if (s >= 180 && !warn.classList.contains('show')) {
      warn.textContent = '已經超過 3 分鐘還沒起來：請看 VS Code 有沒有跳出「preLaunchTask 錯誤」，或下方「偵錯主控台」的最後幾行。';
      warn.classList.add('show');
    }
  }
  function jump() {
    done = true;
    setPct(100); cnt.textContent = '伺服器已回應'; file.textContent = '切換到操作畫面… ' + target;
    location.replace(target);
  }
  function up() {
    if (done) return;
    if (secs() < 3 && polls <= 2) {                                 // 一打開就有回應 = 舊的 wb_serve 還佔著這個埠
      done = true;
      loading.textContent = '已經有程式在 ' + port + ' 回應 / Already running';
      cnt.textContent = '可能是上一次的 wb_serve 沒有關';
      warn.innerHTML = '按 F5 前 ' + port + ' 就已經有程式在回應：多半是上一次的 wb_serve 沒關，新的會綁不到這個埠。確認後再進入。';
      var b = document.createElement('button'); b.textContent = '切到操作畫面'; b.onclick = function () { location.replace(target); };
      warn.appendChild(b); warn.classList.add('show'); root.style.cursor = 'default';
      return;
    }
    jump();
  }
  function probe() {
    if (done) return;
    polls++;
    var fired = false;
    function once() { if (!fired) { fired = true; up(); } }
    try { fetch(base + '?bootwait=' + Date.now(), { mode: 'no-cors', cache: 'no-store' }).then(once, function () {}); } catch (e) {}
    var img = new Image();
    img.onload = once;
    img.src = base + 'img/homemode/MODE2_Lmt.png?bootwait=' + Date.now();
  }
  setInterval(tick, 200);
  tick();
  probe();
  setInterval(probe, 1000);
})();
</script>
</body>
</html>
