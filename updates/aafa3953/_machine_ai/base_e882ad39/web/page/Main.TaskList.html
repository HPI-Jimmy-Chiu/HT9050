<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Task List（main.dfm tsTaskList）</title>
<link rel="stylesheet" href="ht9xxx.css">
<link rel="stylesheet" href="theme.css">
<style>
  body.winpage{padding:0;margin:0;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
  .tlWrap{flex:1;min-height:0;overflow:auto;background:#CCD9DF;}
  table.tlGrid{border-collapse:collapse;font:12px "MS Sans Serif",sans-serif;table-layout:fixed;}
  table.tlGrid td,table.tlGrid th{border:1px solid #9aa;width:50px;height:15px;padding:0 2px;
    overflow:hidden;white-space:nowrap;text-align:center;box-sizing:border-box;}
  table.tlGrid td{background:#CCD9DF;color:#123;}
  table.tlGrid th{background:#517B91;color:#fff;font-weight:normal;position:sticky;}
  table.tlGrid thead th{top:0;z-index:2;}
  table.tlGrid tbody th{left:0;z-index:1;}
  table.tlGrid thead th:first-child{left:0;z-index:3;}
  .srcnote{padding:4px 8px;}
</style>
</head>
<body class="winpage">

<div class="tlWrap" title="sgTaskList : TStringGrid（ColCount=110 / RowCount=62）">
  <table class="tlGrid" id="sgTaskList"></table>
</div>

<div class="srcnote">程式碼對應：<code>main.dfm tsTaskList（sgTaskList）</code>；State Record 工作清單（110 欄 × 62 列），對應 <code>Task_ListWithTime.csv</code>；雙擊/選格觸發 <code>StringGrid2DblClick</code>／<code>StringGrid2SelectCell</code></div>

<script>
// sgTaskList：ColCount=110、RowCount=62、FixedCols=1、FixedRows=1（TStringGrid 預設）
(function(){
  var COLS=110, ROWS=62, t=document.getElementById('sgTaskList');
  var thead=document.createElement('thead'), hr=document.createElement('tr');
  for(var c=0;c<COLS;c++){var th=document.createElement('th');th.textContent=c;hr.appendChild(th);}
  thead.appendChild(hr); t.appendChild(thead);
  var tb=document.createElement('tbody');
  for(var r=1;r<ROWS;r++){
    var tr=document.createElement('tr');
    var rh=document.createElement('th');rh.textContent=r;tr.appendChild(rh);
    for(var c=1;c<COLS;c++) tr.appendChild(document.createElement('td'));
    tb.appendChild(tr);
  }
  t.appendChild(tb);
})();
</script>
<script src="theme.js"></script>
</body>
</html>
