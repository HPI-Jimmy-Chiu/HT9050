<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Heater View（main.dfm tsHeaterView）</title>
<link rel="stylesheet" href="ht9xxx.css">
<link rel="stylesheet" href="theme.css">
<style>
  body.winpage{padding:0;margin:0;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
  .hvPanel{flex:1;display:flex;flex-direction:column;min-height:0;padding:10px;box-sizing:border-box;
    background:#A6B8C2;border:2px groove #dfe6ee;gap:8px;}
  .hvCols{flex:1;display:flex;gap:16px;min-height:0;}
  .hvCol{flex:1;display:flex;flex-direction:column;min-height:0;}
  .hvHd{flex:none;background:#517B91;color:#fff;font:bold 15px "MS Sans Serif",sans-serif;
    text-align:center;padding:3px 0;border:1px inset #7f97a8;}
  .hvGridWrap{flex:1;overflow:auto;min-height:0;margin-top:6px;background:#CCD9DF;border:1px inset #8a9aa8;}
  table.hvGrid{border-collapse:collapse;font:13px "MS Sans Serif",sans-serif;width:100%;}
  table.hvGrid td,table.hvGrid th{border:1px solid #9aa;height:20px;padding:0 4px;text-align:center;}
  table.hvGrid td{background:#CCD9DF;color:#123;}
  table.hvGrid th{background:#517B91;color:#fff;font-weight:normal;}
  .hvMsg{flex:none;border:1px groove #dfe6ee;padding:4px 8px;}
  .hvMsg>b{font-size:12px;color:#234;}
  .hvMsg .opts{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:3px;}
  .hvMsg label{display:flex;align-items:center;gap:4px;font-size:13px;color:#123;user-select:none;}
</style>
</head>
<body class="winpage">

<div class="hvPanel" title="PanelMain8 : TPanel">
  <div class="hvCols">
    <div class="hvCol">
      <div class="hvHd" id="palHP2View" title="palHP2View : TPanel（OnClick=palHP2ViewClick）">HOTPLATE 2</div>
      <div class="hvGridWrap"><table class="hvGrid" id="StringGrid4" title="StringGrid4 : TStringGrid（4×12）"></table></div>
    </div>
    <div class="hvCol">
      <div class="hvHd" id="palHP1View" title="palHP1View : TPanel">HOTPLATE 1</div>
      <div class="hvGridWrap"><table class="hvGrid" id="StringGrid5" title="StringGrid5 : TStringGrid（4×12）"></table></div>
    </div>
  </div>
  <div class="hvMsg" id="rgHotplateShowMessage" title="rgHotplateShowMessage : TRadioGroup（OnClick=rgHotplateShowMessageClick）">
    <b>Message</b>
    <div class="opts">
      <label><input type="radio" name="hpMsg" checked> [1] Hot Time</label>
      <label><input type="radio" name="hpMsg"> [2] Which Shuttle</label>
      <label><input type="radio" name="hpMsg"> [3] Which Kit</label>
      <label><input type="radio" name="hpMsg"> [4] Count</label>
      <label><input type="radio" name="hpMsg"> [5] Which Row</label>
      <label><input type="radio" name="hpMsg"> [6] Which Site</label>
      <label><input type="radio" name="hpMsg"> [7] Table HP</label>
    </div>
  </div>
</div>

<div class="srcnote">程式碼對應：<code>main.dfm tsHeaterView（PanelMain8）</code>；<code>StringGrid4</code>/<code>StringGrid5</code> 顯示 HOTPLATE 2/1 各站溫控狀態（4 欄×12 列），<code>rgHotplateShowMessage</code> 切換顯示欄位（<code>SaveHPPick</code>/<code>btnSaveHPTable</code> 預設 Visible=False 不轉出）</div>

<script>
(function(){
  function build(id,cols,rows){
    var t=document.getElementById(id);
    for(var r=0;r<rows;r++){
      var tr=document.createElement('tr');
      for(var c=0;c<cols;c++){
        var cell=document.createElement(r===0||c===0?'th':'td');
        tr.appendChild(cell);
      }
      t.appendChild(tr);
    }
  }
  build('StringGrid4',4,12); build('StringGrid5',4,12);
})();
</script>
<script src="theme.js"></script><script src="ht9045_recipe_client.js"></script><script src="ht9045_main_st01_ev.js"></script><!-- AI(W906-EVB6) 20260928 [W906]：M-16 palHP2View（act.main.hp2View）；同一行 -->
</body>
</html>
