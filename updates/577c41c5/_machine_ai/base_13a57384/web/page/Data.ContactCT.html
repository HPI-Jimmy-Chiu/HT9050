<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Contact Counter Kinds（cContactCT.dfm）</title>
<link rel="stylesheet" href="ht9xxx.css">
<link rel="stylesheet" href="theme.css">
<style>
  /* Steven 20260925：格子顏色／字型全部由 C++ 回應決定（golden sgYieldDrawCell 的 MyDrawText 擷取），這裡只放框線與排版 */
  #rgYieldType{font-size:11px;margin-top:6px;line-height:1.9;display:grid;border:1px solid #999;padding:2px 6px;font-weight:bold;}
  #rgYieldType label{white-space:nowrap;}
  table.ctgrid{border-collapse:collapse;margin-top:6px;table-layout:fixed;}
  table.ctgrid td{border:1px solid #888;padding:0 2px;text-align:center;vertical-align:middle;white-space:nowrap;overflow:hidden;
    font-family:Batang,"MS Sans Serif",sans-serif;font-size:11px;}
  table.ctgrid td.drawn{font-family:"MS Sans Serif",sans-serif;}
  #ctStatus{font-size:11px;margin-top:4px;min-height:14px;}
  /* AI(W906-NOOVERLAP) 20260930: ht9xxx-layout-base.js moves btClearCount to the bottom right (translate 203,291); there it ended 3px below the 320px window content (background.html contactct h:346). Lifted 4px so it stays inside the window. */
  #btClearCount{position:relative;top:-4px;}
</style>
</head>
<body class="winpage">

<div style="display:flex;gap:8px;" title="palClearCnt">
  <button class="btn3d" id="btClearCount" title="btClearCount">Count Clear</button>
  <button class="btn3d" id="btYieldChart" title="btYieldChart">Yield Chart</button>
</div>

<!-- 選項由 contactct.get 回應產生（golden FormShow :43-72 依 CosFunction 加減選項） -->
<div id="rgYieldType" title="rgYieldType（TRadioGroup）"></div>

<table class="ctgrid" id="sgYield" title="sgYield（TStringGrid）"></table>

<div id="ctStatus"></div>

<div class="srcnote">程式碼對應：<code>cContactCT.dfm</code>／<code>cContactCT.cpp</code>（golden V912 TfContactCT）；資料來源 C++ WS <code>contactct.get</code>（ArmData／ArmHistory ← system\Arm*.dat）；開著時每秒重取一次（S115；golden 每測完一次 <code>sgYield-&gt;Refresh()</code>，atester_ProcessCount.cpp:1999）</div>

<script src="theme.js"></script>
<script src="ht9045_recipe_client.js"></script>
<script src="ht9045_contactct_wire.js"></script><!-- Steven 20260925：接 C++ fContactCT（golden cContactCT.cpp） -->
</body>
</html>
