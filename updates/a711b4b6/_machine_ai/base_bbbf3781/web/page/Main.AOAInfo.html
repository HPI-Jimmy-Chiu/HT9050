<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>AOA Info（main.dfm ts1）</title>
<link rel="stylesheet" href="ht9xxx.css">
<link rel="stylesheet" href="theme.css">
<style>
  body.winpage{padding:0;margin:0;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
  .aoaWrap{flex:1;display:flex;flex-direction:column;min-height:0;padding:6px;box-sizing:border-box;gap:6px;}
  .aoaMemos{flex:1;display:flex;gap:10px;min-height:0;}
  .aoaMemoBox{flex:1;display:flex;flex-direction:column;min-height:0;}
  .aoaMemoHd{flex:none;font-size:12px;color:#345;margin-bottom:3px;}
  .aoaMemo{flex:1;width:100%;box-sizing:border-box;resize:none;background:#CCD9DF;color:#123;
    border:1px inset #8a9aa8;font:12px "Consolas","Courier New",monospace;padding:4px;min-height:0;}
  .aoaPos{flex:none;background:#A6B8C2;border:1px groove #dfe6ee;padding:4px;overflow-x:auto;}
  table.posTbl{border-collapse:collapse;font:12px "MS Sans Serif",sans-serif;}
  table.posTbl th,table.posTbl td{border:1px solid #8a9aa8;padding:2px 8px;text-align:center;min-width:52px;}
  table.posTbl th{background:#517B91;color:#fff;font-weight:normal;}
  table.posTbl th.axis{background:#3f6377;}
  table.posTbl td{background:#CCD9DF;color:#123;}
</style>
</head>
<body class="winpage">

<div class="aoaWrap">
  <div class="aoaMemos">
    <div class="aoaMemoBox">
      <div class="aoaMemoHd" title="Memo3_AOA_IN">AOA IN</div>
      <textarea class="aoaMemo" id="Memo3_AOA_IN" title="Memo3_AOA_IN : TMemo" readonly></textarea>
    </div>
    <div class="aoaMemoBox">
      <div class="aoaMemoHd" title="Memo3_AOA_OUT">AOA OUT</div>
      <textarea class="aoaMemo" id="Memo3_AOA_OUT" title="Memo3_AOA_OUT : TMemo" readonly></textarea>
    </div>
  </div>
  <div class="aoaPos" title="Panel14 : TPanel（各站 AOA X/Y 位置）">
    <table class="posTbl" id="aoaPosTbl"></table>
  </div>
</div>

<div class="srcnote">程式碼對應：<code>main.dfm ts1（AOA Info）</code>；<code>Memo3_AOA_IN</code>/<code>Memo3_AOA_OUT</code> 為 In/Out AOA 記錄，<code>Panel14</code> 顯示各站 AOA 補正 X/Y（<code>labXxx_X</code>/<code>labXxx_Y</code>）</div>

<script>
(function(){
  // Panel14 各站 X/Y 位置標籤（labXxx_X / labXxx_Y）
  var cols=[['Loader','Loader'],['Hotplate1','Hotplate1'],['Hotplate2','Hotplate2'],
    ['InShuttle1','InShuttle1'],['InShuttle2','InShuttle2'],['SH1_Out','OutShuttle1'],
    ['SH2_Out','OutShuttle2'],['Auto1','Auto1'],['Auto2','Auto2'],['Auto3','Auto3'],
    ['Fix1','Fix1'],['Fix2','Fix2'],['Fix3','Fix3']];
  var t=document.getElementById('aoaPosTbl');
  var hr=document.createElement('tr');
  hr.appendChild(el('th','',{cls:'axis'}));
  cols.forEach(function(c){hr.appendChild(el('th',c[0]));});
  t.appendChild(hr);
  ['X','Y'].forEach(function(ax){
    var tr=document.createElement('tr');
    tr.appendChild(el('th',ax,{cls:'axis'}));
    cols.forEach(function(c){tr.appendChild(el('td','0',{id:'lab'+c[1]+'_'+ax,title:'lab'+c[1]+'_'+ax+' : TLabel'}));});
    t.appendChild(tr);
  });
  function el(tag,txt,o){o=o||{};var e=document.createElement(tag);e.textContent=txt;
    if(o.cls)e.className=o.cls; if(o.id)e.id=o.id; if(o.title)e.title=o.title; return e;}
})();
</script>
<script src="theme.js"></script>
</body>
</html>
