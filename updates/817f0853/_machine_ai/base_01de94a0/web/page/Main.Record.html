<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Record（main.dfm tsRecord）</title>
<link rel="stylesheet" href="ht9xxx.css">
<link rel="stylesheet" href="theme.css">
<style>
  body.winpage{padding:0;margin:0;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
  .rcPanel{flex:1;display:flex;min-height:0;padding:8px;box-sizing:border-box;gap:10px;
    background:var(--panel);border:2px groove #dfe6ee;}
  .rcLeft{flex:1;display:flex;flex-direction:column;min-height:0;gap:6px;}
  .rcRight{width:340px;display:flex;flex-direction:column;min-height:0;gap:6px;}
  .rcHd{flex:none;background:#B6D1AD;color:#123;font:bold 15px "MS Sans Serif",sans-serif;
    text-align:center;padding:3px 0;border:1px inset #9ab092;}
  .rcGridWrap{flex:none;overflow:auto;background:#CCD9DF;border:1px inset #8a9aa8;max-height:210px;}
  table.rcGrid{border-collapse:collapse;font:13px "MS Sans Serif",sans-serif;width:100%;}
  table.rcGrid td,table.rcGrid th{border:1px solid #9aa;height:21px;min-width:60px;padding:0 4px;text-align:center;}
  table.rcGrid td{background:#CCD9DF;color:#123;} table.rcGrid th{background:#517B91;color:#fff;font-weight:normal;}
  .rcMemo{flex:1;width:100%;box-sizing:border-box;resize:none;background:#CCD9DF;color:#123;
    border:1px inset #8a9aa8;font:12px "Consolas","Courier New",monospace;padding:4px;min-height:0;}
  .rcBtnRow{flex:none;display:flex;gap:8px;align-items:center;}
  .btn3d{background:var(--panel);border:2px outset #cfcfcf;border-radius:3px;padding:3px 12px;
    font:13px "MS Sans Serif",sans-serif;cursor:pointer;}
  .btn3d:active{border-style:inset;}
  .btn3d.clear{color:#000080;font-weight:bold;}
</style>
</head>
<body class="winpage">

<div class="rcPanel" title="PanelMain2 : TPanel">
  <div class="rcLeft">
    <div class="rcHd" id="palCounter" title="palCounter : TPanel">Counter</div>
    <div class="rcGridWrap"><table class="rcGrid" id="sgDebugRecord" title="sgDebugRecord : TStringGrid（5 欄×9 列）"></table></div>
    <div class="rcBtnRow">
      <button class="btn3d clear" id="spbClearRecord" title="spbClearRecord : TSpeedButton（OnClick=spbClearRecordClick）">CLEAR</button>
    </div>
    <textarea class="rcMemo" id="memoAutoClean" title="memoAutoClean : TMemo（Auto Clean 記錄）" readonly></textarea>
    <div class="rcBtnRow">
      <button class="btn3d" id="btSavelog" title="btSavelog : TButton（OnClick=btSavelogClick）">Save Log</button>
    </div>
  </div>
  <div class="rcRight">
    <textarea class="rcMemo" id="AseRecordMemo" title="AseRecordMemo : TMemo（OnDblClick=meShuttle2DblClick）" readonly></textarea>
  </div>
</div>

<div class="srcnote">程式碼對應：<code>main.dfm tsRecord（PanelMain2）</code>；<code>sgDebugRecord</code> 除錯記錄表、<code>memoAutoClean</code> Auto Clean 記錄、<code>AseRecordMemo</code> ASE 記錄；<code>spbClearRecord</code> 清除、<code>btSavelog</code> 存檔</div>

<script>
(function(){
  var t=document.getElementById('sgDebugRecord');
  for(var r=0;r<9;r++){var tr=document.createElement('tr');
    for(var c=0;c<5;c++){tr.appendChild(document.createElement(r===0||c===0?'th':'td'));}
    t.appendChild(tr);}
})();
</script>
<script src="theme.js"></script>
</body>
</html>
